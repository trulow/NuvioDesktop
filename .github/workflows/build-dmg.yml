name: Build macOS DMG

# Run manually from the Actions tab (no push trigger, so it won't fire on every commit)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # GitHub's macOS runner controls its own JDK
    steps:
      - name: Checkout (Dev branch — submodules handled manually below)
        uses: actions/checkout@v4
        with:
          ref: Dev
          submodules: false   # repo's .gitmodules has a broken 'libass-android'
                              # entry; recursing all submodules fails, so we don't

      - name: Fetch MPVKit (Nuvio branch) directly — bypass the broken .gitmodules
        run: |
          # The repo's .gitmodules has a malformed 'libass-android' entry that
          # breaks every `git submodule` command. We sidestep the submodule
          # subsystem entirely: drop the empty submodule dir and clone MPVKit
          # straight into the path the build expects (./MPVKit).
          rm -rf MPVKit
          git clone --recurse-submodules --branch Nuvio \
            https://github.com/NuvioMedia/MPVKit.git MPVKit
          echo "MPVKit checked out at: $(git -C MPVKit rev-parse --short HEAD)"

      # CI uses JDK 21 — fully supported by Gradle 8.14.3, so no project changes needed
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MPVKit macOS runtime
        run: |
          cd MPVKit
          make build platform=macos

      - name: Create empty local.properties
        run: |
          # The build's generateRuntimeConfigs task requires local.properties to
          # exist. It's gitignored (machine-specific), so it's absent on a fresh
          # checkout. An empty file satisfies the presence check; if a specific
          # key is actually required, the build will name it and we add it here.
          touch local.properties

      - name: Build DMG (non-minified — skips the flaky ProGuard step)
        run: ./gradlew :composeApp:packageDmg

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
