name: Build & Release macOS DMG

# Run manually from the Actions tab. The version is NOT set here — it is read
# from iosApp/Configuration/Version.xcconfig (MARKETING_VERSION), which is the
# single source of truth. To release a new version, edit that file and commit.
on:
  workflow_dispatch:

# Needed so the workflow can create tags and releases on your fork
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # GitHub's macOS runner controls its own JDK
    steps:
      - name: Checkout (Dev branch — submodules handled manually below)
        uses: actions/checkout@v4
        with:
          ref: Dev
          submodules: false   # repo's .gitmodules has a broken 'libass-android'
                              # entry; recursing all submodules fails, so we don't

      - name: Read & validate version from the xcconfig
        id: ver
        run: |
          set -e
          XCCFG="iosApp/Configuration/Version.xcconfig"
          # Pull the value to the right of '=' and strip whitespace
          VER="$(grep -E '^[[:space:]]*MARKETING_VERSION[[:space:]]*=' "$XCCFG" \
                  | head -n1 | sed -E 's/.*=[[:space:]]*//' | tr -d '[:space:]')"
          echo "MARKETING_VERSION read from $XCCFG: '$VER'"
          # jpackage requires 1-3 integers, first >= 1
          FIRST="$(echo "$VER" | cut -d. -f1)"
          if ! echo "$VER" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$' || [ "${FIRST:-0}" -lt 1 ]; then
            echo "::error::MARKETING_VERSION='$VER' is not valid for the macOS bundle."
            echo "::error::jpackage needs 1-3 integers separated by dots with the first >= 1 (e.g. 1.0.0)."
            echo "::error::Edit $XCCFG, set a valid MARKETING_VERSION, commit, and re-run."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Fetch MPVKit (Nuvio branch) directly — bypass the broken .gitmodules
        run: |
          rm -rf MPVKit
          git clone --recurse-submodules --branch Nuvio \
            https://github.com/NuvioMedia/MPVKit.git MPVKit
          echo "MPVKit checked out at: $(git -C MPVKit rev-parse --short HEAD)"

      # CI uses JDK 21 — fully supported by Gradle 8.14.3, so no project changes needed
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MPVKit macOS runtime
        run: |
          cd MPVKit
          make build platform=macos

      - name: Create empty local.properties
        run: touch local.properties

      - name: Build DMG (non-minified — skips the flaky ProGuard step)
        # No version flag needed: the build reads MARKETING_VERSION from the xcconfig.
        run: ./gradlew :composeApp:packageDmg

      - name: Show jpackage logs on failure
        if: failure()
        run: |
          echo "===== jpackage ERROR log ====="
          cat composeApp/build/compose/logs/createDistributable/*-err.txt 2>/dev/null || echo "(none)"
          echo "===== jpackage OUTPUT log ====="
          cat composeApp/build/compose/logs/createDistributable/*-out.txt 2>/dev/null || echo "(none)"

      - name: Rename DMG with version
        id: dmg
        run: |
          SRC="$(ls composeApp/build/compose/binaries/main/dmg/*.dmg | head -n1)"
          DEST="NuvioDesktop-${{ steps.ver.outputs.version }}.dmg"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          DMG="${{ steps.dmg.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its DMG asset."
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "NuvioDesktop ${{ steps.ver.outputs.version }}" \
              --notes "Automated non-minified build of the Dev branch." \
              --target Dev
          fi
