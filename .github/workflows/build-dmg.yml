name: Build & Release macOS DMG

# Run manually from the Actions tab. Pick a bump type, or type an explicit
# version to override auto-increment.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored if 'version' is filled in)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version e.g. 1.4.0 (leave blank to auto-bump)"
        type: string
        default: ""

# Needed so the workflow can create tags and releases on your fork
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # GitHub's macOS runner controls its own JDK
    steps:
      - name: Checkout (Dev branch — submodules handled manually below)
        uses: actions/checkout@v4
        with:
          ref: Dev
          submodules: false   # repo's .gitmodules has a broken 'libass-android'
                              # entry; recursing all submodules fails, so we don't

      - name: Determine version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            NEW="${{ inputs.version }}"
            echo "Using explicit version: $NEW"
          else
            # Latest release tag on this repo, e.g. v1.2.3 (fall back to v0.0.0)
            LATEST="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
            [ -z "$LATEST" ] && LATEST="v0.0.0"
            CUR="${LATEST#v}"
            MAJOR="$(echo "$CUR" | cut -d. -f1)"; MAJOR="${MAJOR:-0}"
            MINOR="$(echo "$CUR" | cut -d. -f2)"; MINOR="${MINOR:-0}"
            PATCH="$(echo "$CUR" | cut -d. -f3)"; PATCH="${PATCH:-0}"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac
            NEW="${MAJOR}.${MINOR}.${PATCH}"
            echo "Latest release: $LATEST  ->  new version: $NEW"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW"    >> "$GITHUB_OUTPUT"

      - name: Fetch MPVKit (Nuvio branch) directly — bypass the broken .gitmodules
        run: |
          rm -rf MPVKit
          git clone --recurse-submodules --branch Nuvio \
            https://github.com/NuvioMedia/MPVKit.git MPVKit
          echo "MPVKit checked out at: $(git -C MPVKit rev-parse --short HEAD)"

      # CI uses JDK 21 — fully supported by Gradle 8.14.3, so no project changes needed
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MPVKit macOS runtime
        run: |
          cd MPVKit
          make build platform=macos

      - name: Create empty local.properties
        run: touch local.properties

      - name: Inspect how the build script sets its version
        run: |
          echo "=== version-related lines in composeApp/build.gradle.kts ==="
          grep -n -iE 'version|nativeDistributions|packageVersion' composeApp/build.gradle.kts || true

      - name: Build DMG (non-minified — skips the flaky ProGuard step)
        run: |
          # -Pversion only set the root project's version; the composeApp module
          # stayed "unspecified", so jpackage still got an invalid version.
          # An init script forces the version on EVERY project, and Compose's
          # packageVersion defaults to project.version.
          echo 'allprojects { version = "${{ steps.ver.outputs.version }}" }' > force-version.init.gradle.kts
          ./gradlew :composeApp:packageDmg --init-script force-version.init.gradle.kts

      - name: Show jpackage logs on failure
        if: failure()
        run: |
          echo "===== jpackage ERROR log ====="
          cat composeApp/build/compose/logs/createDistributable/*-err.txt 2>/dev/null || echo "(none)"
          echo "===== jpackage OUTPUT log ====="
          cat composeApp/build/compose/logs/createDistributable/*-out.txt 2>/dev/null || echo "(none)"

      - name: Rename DMG with version
        id: dmg
        run: |
          SRC="$(ls composeApp/build/compose/binaries/main/dmg/*.dmg | head -n1)"
          DEST="NuvioDesktop-${{ steps.ver.outputs.version }}.dmg"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${{ steps.dmg.outputs.path }}" \
            --title "NuvioDesktop ${{ steps.ver.outputs.version }}" \
            --notes "Automated non-minified build of the Dev branch." \
            --target Dev
