name: Inspect source (diagnostic)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest   # no build — just read files, so Linux is fine & fast
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          submodules: false

      - name: Print ProfileScopedKey + current-profile source
        run: |
          echo "===== ProfileScopedKey*.kt (all platforms) ====="
          for f in $(find composeApp/src -iname 'ProfileScopedKey*.kt' 2>/dev/null); do
            echo "########## $f ##########"
            cat "$f"
            echo
          done

          echo "===== ProfileContext / current-profile holder (what ProfileScopedKey reads) ====="
          for f in $(find composeApp/src -iname 'ProfileContext*.kt' -o -iname 'CurrentProfile*.kt' -o -iname 'ActiveProfile*.kt' 2>/dev/null); do
            echo "########## $f ##########"
            cat "$f"
            echo
          done

          echo "===== how 'current/active profile' is referenced across desktopMain + commonMain ====="
          grep -rnE 'currentProfile|activeProfile|CurrentProfile|ActiveProfile|ProfileContext|requireProfile|error\(|require\(|checkNotNull' \
            composeApp/src/commonMain composeApp/src/desktopMain 2>/dev/null \
            | grep -iE 'profile|error|require|checkNotNull' | head -60 || true

          echo "===== anything ProfileScopedKey imports/depends on that could throw at init ====="
          for f in $(find composeApp/src -iname 'ProfileScopedKey*.kt' 2>/dev/null); do
            grep -nE '^import|object|init \{|by lazy|=\s*[A-Z]' "$f" || true
          done
