name: Inspect source (diagnostic)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest   # no build — just read files, so Linux is fine & fast
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          submodules: false

      - name: Print DesktopStorage + storage backend
        run: |
          echo "===== DesktopStorage / *Storage* in desktopMain ====="
          FILES="$(find composeApp/src/desktopMain -iname '*Storage*.kt' 2>/dev/null)"
          if [ -z "$FILES" ]; then
            echo "(no *Storage*.kt found in desktopMain — searching wider)"
            FILES="$(find composeApp/src -iname 'DesktopStorage*.kt' 2>/dev/null)"
          fi
          for f in $FILES; do
            echo "########## $f ##########"
            cat "$f"
            echo
          done

          echo "===== commonMain DesktopStorage/Storage expect decls (for context) ====="
          grep -rnE 'expect .*Storage|interface .*Storage|object Storage' composeApp/src/commonMain 2>/dev/null | head -20 || true
          echo

          echo "===== storage-related deps in composeApp/build.gradle.kts ====="
          grep -niE 'sqlite|sqldelight|datastore|preferences|jna\b|jni|rocksdb|\bh2\b|derby|mapdb|moko|multiplatform-settings|russhwolf|settings' composeApp/build.gradle.kts | head -50 || true
          echo

          echo "===== native loads / resource refs anywhere a static init might hit ====="
          grep -rnoE 'System\.loadLibrary\([^)]*\)|System\.load\([^)]*\)|\.dylib|\.so\b|sqlite|jdbc' composeApp/src/desktopMain 2>/dev/null | grep -viE 'player|mpv' | head -40 || true
